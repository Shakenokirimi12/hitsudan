name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write        # タグを打ったときに Release を作るため

jobs:
  build:
    runs-on: macos-latest
    env:
      SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: 環境
        run: |
          swift --version
          sw_vers

      - name: 図形認識のテスト
        run: ./Tools/run-tests.sh

      # 署名鍵はリポジトリには置けないので Secrets から一時キーチェーンへ。
      # Secrets が無ければ丸ごと飛ばし、build.sh がアドホック署名に落ちる。
      - name: Developer ID を読み込む
        if: env.SIGN_IDENTITY != ''
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -e
          keychain="$RUNNER_TEMP/build.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          # これが無いと codesign が鍵を使うたびに GUI 確認を求めて詰まる
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$password" "$keychain" >/dev/null
          security list-keychain -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$keychain"

      - name: ビルド
        env:
          HITSUDAN_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: ./build.sh

      - name: 成果物を検証
        run: |
          set -e
          binary=Hitsudan.app/Contents/MacOS/Hitsudan

          echo "--- ユニバーサルか ---"
          lipo -info "$binary"
          lipo -info "$binary" | grep -q arm64
          lipo -info "$binary" | grep -q x86_64

          echo "--- 最小 OS が Info.plist の申告どおりか ---"
          # 一度ここが 26.0 になっていて、plist の 13.0 が嘘になっていた。
          # ユニバーサルバイナリだと vtool は両スライス分をまとめて出すので、
          # 全体を grep すると片方だけ正しくても通ってしまう。1枚ずつ剥がす。
          for arch in arm64 x86_64; do
            lipo -thin "$arch" "$binary" -output "$RUNNER_TEMP/slice-$arch"
            vtool -show-build "$RUNNER_TEMP/slice-$arch" | grep -E "minos"
            vtool -show-build "$RUNNER_TEMP/slice-$arch" | grep -q "minos 13.0" \
              || { echo "$arch スライスの minos が 13.0 ではありません"; exit 1; }
          done
          grep -A1 LSMinimumSystemVersion Hitsudan.app/Contents/Info.plist | grep -q 13.0

          echo "--- アイコンが入っているか ---"
          test -s Hitsudan.app/Contents/Resources/Hitsudan.icns

          echo "--- 署名 ---"
          codesign -dvv Hitsudan.app 2>&1 | grep -E "Authority|Identifier|Runtime" || true
          codesign --verify --deep --strict --verbose=2 Hitsudan.app
          # --verify はアドホック署名でも通る。Developer ID を要求したときに
          # 本当にそれで署名されたかは、別に確かめないと分からない。
          if [ -n "$SIGN_IDENTITY" ]; then
            codesign -dvv Hitsudan.app 2>&1 | grep -q "Authority=Developer ID Application" \
              || { echo "Developer ID を指定したのに、その署名になっていません"; exit 1; }
            codesign -dvv Hitsudan.app 2>&1 | grep -q "flags=.*runtime" \
              || { echo "ハードンドランタイムが付いていません（公証に通りません）"; exit 1; }
          fi

      - name: MCP サーバの疎通確認
        run: |
          set -e
          out=$(printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | ./hitsudan-mcp)
          echo "$out"
          for tool in read_board wait_for_board request_board collect_board show_on_board clear_board board_status; do
            echo "$out" | grep -q "\"$tool\"" || { echo "ツール $tool が見当たりません"; exit 1; }
          done

      - name: アプリを固める
        run: ditto -c -k --keepParent Hitsudan.app Hitsudan.app.zip

      # 公証まで通していないと、配った先の Mac では Gatekeeper に止められる。
      # タグを打ったときだけ実行する（1回あたり数分かかるため）。
      - name: 公証して staple する
        if: startsWith(github.ref, 'refs/tags/v') && env.NOTARY_KEY_ID != ''
        env:
          KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -e
          echo "$KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool submit Hitsudan.app.zip \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$KEY_ID" --issuer "$ISSUER_ID" \
            --wait --timeout 30m
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          # チケットをアプリに焼き付けてから固め直す。zip には staple できない。
          xcrun stapler staple Hitsudan.app
          xcrun stapler validate Hitsudan.app
          rm -f Hitsudan.app.zip
          ditto -c -k --keepParent Hitsudan.app Hitsudan.app.zip
          spctl --assess --type execute --verbose=2 Hitsudan.app

      - uses: actions/upload-artifact@v4
        with:
          name: Hitsudan.app
          path: Hitsudan.app.zip

      - name: Release に載せる
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          tag="${GITHUB_REF_NAME}"

          # 「署名した」と「公証を通した」は別。公証は Secrets が揃っている
          # タグのときだけ走るので、成果物そのものに聞いて書き分ける。
          # stapler validate はチケットが焼かれている場合だけ成功する。
          signed=0
          if codesign -dvv Hitsudan.app 2>&1 | grep -q "Authority=Developer ID Application"; then
            signed=1
          fi
          stapled=0
          if xcrun stapler validate Hitsudan.app >/dev/null 2>&1; then
            stapled=1
          fi

          if [ "$signed" -eq 1 ] && [ "$stapled" -eq 1 ]; then
            note="Developer ID で署名し、公証（notarization）も通しています。そのまま開けます。"
          elif [ "$signed" -eq 1 ]; then
            note="Developer ID で署名済みですが、**公証は通っていません**（公証用の Secrets が未設定）。初回起動時に右クリック → 開く が必要です。"
          else
            note="**アドホック署名です**（署名用の Secrets が未設定）。初回起動時に右クリック → 開く が必要で、再ビルドのたびに入力監視の許可を取り直すことになります。"
          fi

          body=$(printf '%s\n\n%s\n\n%s' \
            "筆談ボード $tag" \
            "$note" \
            "macOS 13 以降・ユニバーサル（Apple Silicon / Intel）。展開して /Applications に置き、システム設定 → プライバシーとセキュリティ → 入力監視 と アクセシビリティ を許可してください。")

          # 同じタグでワークフローを再実行しても落ちないように、あれば貼り替える。
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" Hitsudan.app.zip --clobber
            gh release edit "$tag" --title "$tag" --notes "$body"
          else
            gh release create "$tag" Hitsudan.app.zip --title "$tag" --notes "$body"
          fi
