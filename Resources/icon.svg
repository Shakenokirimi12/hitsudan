<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#17584A"/>
      <stop offset="1" stop-color="#05201C"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#DCE6E1"/>
      <stop offset="1" stop-color="#A9BDB6"/>
    </linearGradient>
    <linearGradient id="ink" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FEDD0"/>
      <stop offset="1" stop-color="#F3F7F4"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="228" fill="url(#ground)"/>

  <g stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="7" stroke-linecap="round">
    <line x1="150" y1="286" x2="874" y2="286"/>
    <line x1="150" y1="470" x2="874" y2="470"/>
    <line x1="150" y1="654" x2="874" y2="654"/>
    <line x1="150" y1="838" x2="874" y2="838"/>
  </g>

  <!-- the mark the nib is leaving: fat in the middle, tapering to nothing -->
  <path fill="url(#ink)" d="
    M 470 566
    C 372 652 282 716 168 792
    C 296 756 414 700 528 622
    Z"/>

  <!-- nib, tip meeting the start of the stroke -->
  <g transform="translate(540 528) rotate(45)">
    <path fill="url(#steel)" d="M -96 -330 L 96 -330 L 96 -52 L 0 96 L -96 -52 Z"/>
    <path fill="#05201C" d="M -22 -140 L 22 -140 L 11 34 L 0 74 L -11 34 Z"/>
    <circle cx="0" cy="-190" r="34" fill="#05201C"/>
  </g>
</svg>
